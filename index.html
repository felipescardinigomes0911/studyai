<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dybass Estudioso</title>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="offline.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      display: flex;
      height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #c0392b; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #0f0f0f;
      border-right: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid #1a1a1a;
    }

    .sidebar-logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .sidebar-logo span {
      font-size: 11px;
      color: #8b0000;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Seletor de cadernos */
    .set-picker {
      padding: 12px 12px 4px;
      border-bottom: 1px solid #1a1a1a;
    }
    .set-picker-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 6px;
    }
    .set-select {
      width: 100%;
      background: #141414;
      color: #e8e8e8;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .set-select:focus { border-color: #8b0000; }
    .set-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .set-btn {
      flex: 0 0 auto;
      background: #141414;
      color: #bbb;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .set-btn:first-child { flex: 1; }
    .set-btn:hover:not(:disabled) { border-color: #8b0000; color: #fff; }
    .set-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .set-btn-danger:hover:not(:disabled) { border-color: #8b0000; color: #ff6b6b; }
    body.light .set-picker { border-bottom-color: #dcdcdc; }
    body.light .set-picker-label { color: #999; }
    body.light .set-select { background: #fff; color: #222; border-color: #d0d0d0; }
    body.light .set-btn { background: #fff; color: #666; border-color: #d0d0d0; }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: #161616;
      color: #ccc;
    }

    .nav-item.active {
      background: #1a0000;
      color: #fff;
      border-left: 3px solid #8b0000;
      padding-left: 11px;
    }

    .nav-item .nav-icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid #1a1a1a;
      font-size: 11px;
      color: #333;
      text-align: center;
    }

    /* Main content */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 28px 36px 20px;
      border-bottom: 1px solid #141414;
      background: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .page-header p {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .page-content {
      padding: 28px 36px;
      flex: 1;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #8b0000;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #a00000;
    }

    .btn-secondary {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #222;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #222;
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: #8b0000;
      border: 1px solid #8b0000;
    }

    .btn-outline:hover:not(:disabled) {
      background: #8b0000;
      color: #fff;
    }

    /* Content section */
    .content-textarea {
      width: 100%;
      min-height: 400px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 15px;
      line-height: 1.7;
      padding: 20px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .content-textarea:focus {
      border-color: #8b0000;
    }

    .content-textarea::placeholder {
      color: #333;
    }

    .content-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .char-count {
      font-size: 12px;
      color: #444;
      margin-left: auto;
    }

    .saved-badge {
      font-size: 12px;
      color: #2d7a2d;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Summary section */
    .summary-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* Lista de resumos salvos (histórico do caderno) */
    .saved-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .saved-chip {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      background: #141414;
    }
    .saved-chip.active { border-color: #8b0000; }
    .saved-chip-open {
      background: transparent;
      color: #ccc;
      border: none;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .saved-chip.active .saved-chip-open { color: #fff; }
    .saved-chip-open:hover { color: #fff; }
    .saved-chip-del {
      background: transparent;
      color: #666;
      border: none;
      border-left: 1px solid #2a2a2a;
      padding: 0 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .saved-chip-del:hover { color: #ff6b6b; background: #1a0000; }
    .saved-chip-edit {
      background: transparent;
      color: #666;
      border: none;
      border-left: 1px solid #2a2a2a;
      padding: 0 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .saved-chip-edit:hover { color: #fff; background: #1a1a1a; }
    body.light .saved-chip { background: #fff; border-color: #d8d8d8; }
    body.light .saved-chip-open { color: #444; }
    body.light .saved-chip-del { border-left-color: #e0e0e0; }
    body.light .saved-chip-edit { border-left-color: #e0e0e0; color: #888; }

    /* Abas dos resumos */
    .sum-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 2px solid #222;
      margin-bottom: 16px;
      padding-bottom: 0;
    }
    .sum-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      max-width: 220px;
      padding: 9px 12px;
      background: #111;
      border: 1px solid #222;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: #999;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: -2px;
    }
    .sum-tab:hover { color: #ccc; }
    .sum-tab.active {
      background: #1a0000;
      border-color: #8b0000;
      color: #fff;
      border-bottom: 2px solid #1a0000;
    }
    .sum-tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum-tab-close { color: #666; font-size: 12px; border-radius: 4px; padding: 0 4px; }
    .sum-tab-close:hover { color: #ff6b6b; background: rgba(139,0,0,0.2); }
    .sum-tab.active .sum-tab-close { color: #d88; }
    body.light .sum-tabs { border-bottom-color: #dcdcdc; }
    body.light .sum-tab { background: #f2f2f2; border-color: #dcdcdc; color: #666; }
    body.light .sum-tab.active { background: #ffe3e3; border-color: #c0392b; color: #a01818; border-bottom-color: #ffe3e3; }

    /* Barra de ações do resumo ativo */
    .sum-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* Botão de excluir o cartão atual */
    .card-del-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #777;
      border-radius: 6px;
      padding: 2px 8px;
      margin-left: 10px;
      cursor: pointer;
      font-size: 12px;
      vertical-align: middle;
    }
    .card-del-btn:hover { color: #ff6b6b; border-color: #8b0000; }

    .summary-result {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 24px;
      font-size: 15px;
      line-height: 1.8;
      color: #ddd;
      white-space: pre-wrap;
      min-height: 200px;
    }

    .summary-result h1, .summary-result h2, .summary-result h3 {
      color: #fff;
      margin: 16px 0 8px;
    }

    /* Resumo organizado por capítulos */
    .sum-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 8px;
    }
    .sum-chapter {
      font-size: 15px;
      font-weight: 700;
      color: #c0392b;
      margin: 22px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a0000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sum-chapter:first-of-type { margin-top: 8px; }
    .sum-para { color: #ddd; line-height: 1.8; margin: 0 0 6px; }
    .sum-bullet { color: #ddd; line-height: 1.7; margin: 4px 0; padding-left: 4px; }
    .sum-terms {
      color: #9a8; font-size: 13px; margin: 8px 0 4px;
      background: #0d140d; border-left: 3px solid #2d7a2d;
      padding: 8px 12px; border-radius: 4px;
    }
    body.light .sum-title { color: #111; }
    body.light .sum-chapter { color: #a01818; border-bottom-color: #f0cccc; }
    body.light .sum-para, body.light .sum-bullet { color: #333; }
    body.light .sum-terms { color: #2d5a2d; background: #eef7ee; }

    /* Seletor de capítulo (chips) */
    .chapter-bar {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 20px; align-items: center;
    }
    .chapter-bar-label { font-size: 12px; color: #666; margin-right: 4px; }
    .chapter-select {
      max-width: 420px;
      background: #141414;
      color: #e8e8e8;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .chapter-select:focus { border-color: #8b0000; }
    .chapter-clear {
      background: transparent; border: 1px solid #2a2a2a; color: #999;
      border-radius: 8px; padding: 7px 12px; font-size: 12px;
      font-family: inherit; cursor: pointer;
    }
    .chapter-clear:hover { border-color: #8b0000; color: #ff6b6b; }
    body.light .chapter-select { background: #fff; color: #222; border-color: #d0d0d0; }
    body.light .chapter-clear { background: #fff; color: #666; border-color: #d0d0d0; }
    .chip {
      padding: 6px 14px; border-radius: 20px; font-size: 13px;
      background: #141414; border: 1px solid #222; color: #999;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .chip:hover { border-color: #3a0000; color: #ccc; }
    .chip.active { background: #1a0000; border-color: #8b0000; color: #fff; }
    body.light .chip { background: #ececed; border-color: #dcdcdc; color: #666; }
    body.light .chip.active { background: #ffe3e3; border-color: #c0392b; color: #a01818; }
    .chapter-tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      color: #c0392b; background: #1a0000; border: 1px solid #3a0000;
      padding: 2px 10px; border-radius: 12px; margin-bottom: 12px;
    }
    body.light .chapter-tag { background: #ffe3e3; border-color: #f0cccc; color: #a01818; }

    /* Flashcards section */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .flashcard-progress {
      font-size: 13px;
      color: #555;
      align-self: flex-end;
    }

    .flashcard-scene {
      width: 100%;
      max-width: 640px;
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
    }

    .flashcard-front {
      background: #141414;
      border: 1px solid #222;
    }

    .flashcard-back {
      background: #140000;
      border: 1px solid #3a0000;
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .flashcard-front .flashcard-label { color: #888; }
    .flashcard-back .flashcard-label { color: #8b0000; }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.6;
      color: #e8e8e8;
    }

    .flashcard-hint {
      font-size: 12px;
      color: #333;
      margin-top: 20px;
    }

    .flashcard-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .flashcard-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 300px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #222;
      transition: background 0.2s;
    }

    .dot.active { background: #8b0000; }
    .dot.visited { background: #3a0000; }

    /* Quiz section */
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .quiz-score {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      color: #888;
    }

    .quiz-score strong {
      color: #c0392b;
      font-size: 16px;
    }

    .quiz-progress-bar {
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      background: #8b0000;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .quiz-question-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .quiz-question-num {
      font-size: 11px;
      color: #8b0000;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .quiz-question-text {
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #1e1e1e;
      background: #0f0f0f;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      color: #ccc;
      font-size: 15px;
      line-height: 1.5;
    }

    .quiz-option:hover:not(.answered) {
      border-color: #3a0000;
      background: #120000;
      color: #fff;
    }

    .quiz-option.selected {
      border-color: #555;
      background: #161616;
      color: #fff;
    }

    .quiz-option.correct {
      border-color: #2d7a2d;
      background: #0a1a0a;
      color: #5cb85c;
    }

    .quiz-option.wrong {
      border-color: #7a0000;
      background: #1a0000;
      color: #e05555;
    }

    .quiz-option.reveal-correct {
      border-color: #2d7a2d;
      background: #0a1a0a;
      color: #5cb85c;
    }

    .option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #1a1a1a;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .quiz-option.correct .option-letter,
    .quiz-option.reveal-correct .option-letter {
      background: #1a3a1a;
      color: #5cb85c;
    }

    .quiz-option.wrong .option-letter { background: #3a0000; color: #e05555; }

    .quiz-feedback {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-feedback.correct { background: #0a1a0a; color: #5cb85c; border: 1px solid #2d7a2d; }
    .quiz-feedback.wrong { background: #1a0000; color: #e05555; border: 1px solid #7a0000; }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Results */
    .quiz-results {
      text-align: center;
      padding: 48px 24px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
    }

    .results-emoji {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .results-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .results-score {
      font-size: 48px;
      font-weight: 800;
      color: #c0392b;
      margin: 20px 0;
    }

    .results-detail {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
    }

    /* Empty / loading states */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      color: #333;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-title {
      font-size: 16px;
      color: #444;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      color: #333;
      max-width: 320px;
      line-height: 1.6;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-banner {
      background: #1a0000;
      border: 1px solid #7a0000;
      border-radius: 10px;
      padding: 14px 18px;
      color: #e05555;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-divider {
      height: 1px;
      background: #141414;
      margin: 24px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-red { background: #1a0000; color: #c0392b; border: 1px solid #3a0000; }
    .badge-offline { background: #0a1a0a; color: #5cb85c; border: 1px solid #1a3a1a; }

    /* Mode toggle in sidebar */
    .mode-toggle {
      padding: 14px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mode-label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #2a2a2a;
      border-radius: 22px;
      transition: 0.2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #ccc;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider { background: #2d7a2d; }
    input:checked + .slider:before { transform: translateX(18px); background: #fff; }

    .mode-hint {
      font-size: 10px;
      color: #444;
      line-height: 1.4;
    }

    .apikey-box {
      display: flex; flex-direction: column; gap: 6px;
      margin-top: 8px; padding-top: 10px; border-top: 1px dashed #222;
    }
    .apikey-status { font-size: 10px; color: #888; }
    .apikey-status.ok { color: #5cb85c; }
    .apikey-status.warn { color: #d9a441; }
    .apikey-input {
      background: #141414; border: 1px solid #222; border-radius: 6px;
      color: #e8e8e8; font-size: 11px; padding: 6px 8px; outline: none;
      font-family: inherit;
    }
    .apikey-input:focus { border-color: #8b0000; }
    body.light .apikey-input { background: #fff; border-color: #d0d0d0; color: #1a1a1a; }
    body.light .apikey-box { border-top-color: #dcdcdc; }

    .export-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 12px;
    }

    .export-toast {
      font-size: 12px;
      color: #5cb85c;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Statistics */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #c0392b;
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin: 8px 0 16px;
    }

    .history-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 160px;
      padding: 16px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .history-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .history-bar {
      width: 100%;
      max-width: 36px;
      background: linear-gradient(180deg, #c0392b, #8b0000);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.3s;
    }

    .history-bar-val { font-size: 11px; color: #888; }
    .history-bar-date { font-size: 9px; color: #444; }

    .btn-danger {
      background: transparent;
      color: #777;
      border: 1px solid #2a2a2a;
    }
    .btn-danger:hover:not(:disabled) { color: #e05555; border-color: #7a0000; }

    .btn-success {
      background: #1a3a1a;
      color: #5cb85c;
      border: 1px solid #2d7a2d;
    }
    .btn-success:hover:not(:disabled) { background: #234d23; color: #7ed87e; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .search-icon { font-size: 13px; opacity: 0.6; }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 14px;
      font-family: inherit;
    }

    .search-input::placeholder { color: #444; }

    .search-count {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    body.light .search-bar { background: #fff; border-color: #e0e0e0; }
    body.light .search-input { color: #1a1a1a; }
    body.light .search-input::placeholder { color: #aaa; }

    /* ─── Onboarding / Boas-vindas ───────────────────────────────────────── */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .onboarding-card {
      width: 90%;
      max-width: 480px;
      background: #121212;
      border: 1px solid #2a0000;
      border-radius: 16px;
      padding: 36px 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(139, 0, 0, 0.25);
    }

    body.light .onboarding-card { background: #fff; border-color: #e6b8b8; }

    /* Modal de nome (criar/renomear caderno) */
    .name-prompt {
      width: 90%;
      max-width: 400px;
      background: #121212;
      border: 1px solid #2a0000;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(139, 0, 0, 0.25);
    }
    body.light .name-prompt { background: #fff; border-color: #e6b8b8; }
    .name-prompt-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
    .name-prompt-nav {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .onboarding-emoji { font-size: 56px; margin-bottom: 18px; }

    .onboarding-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    body.light .onboarding-title { color: #111; }

    .onboarding-text {
      font-size: 15px;
      line-height: 1.7;
      color: #aaa;
      margin-bottom: 28px;
      min-height: 96px;
    }
    body.light .onboarding-text { color: #555; }

    .onboarding-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .onboarding-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: 0.2s;
    }
    .onboarding-dot.active { background: #c0392b; width: 24px; border-radius: 5px; }

    .onboarding-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .onboarding-skip {
      background: none;
      border: none;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .onboarding-skip:hover { color: #999; }

    .help-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      opacity: 0.7;
      font-family: inherit;
    }
    .help-btn:hover { opacity: 1; }

    /* ─── Tema claro (preto vira branco; vermelho permanece) ─────────────── */
    body.light { background: #f4f4f5; color: #1a1a1a; }
    body.light ::-webkit-scrollbar-track { background: #e0e0e0; }
    body.light .sidebar { background: #ececed; border-right-color: #dcdcdc; }
    body.light .sidebar-logo { border-bottom-color: #dcdcdc; }
    body.light .sidebar-logo h1 { color: #111; }
    body.light .nav-item { color: #666; }
    body.light .nav-item:hover { background: #e0e0e0; color: #222; }
    body.light .nav-item.active { background: #ffe3e3; color: #111; }
    body.light .sidebar-footer { color: #999; border-top-color: #dcdcdc; }
    body.light .mode-toggle { border-top-color: #dcdcdc; }
    body.light .mode-label { color: #555; }
    body.light .mode-hint { color: #999; }
    body.light .slider { background: #c4c4c4; }
    body.light .page-header { background: #f4f4f5; border-bottom-color: #e0e0e0; }
    body.light .page-header h2 { color: #111; }
    body.light .page-header p { color: #888; }
    body.light .btn-secondary { background: #e6e6e6; color: #333; border-color: #cdcdcd; }
    body.light .btn-secondary:hover:not(:disabled) { background: #dadada; color: #000; }
    body.light .btn-danger { color: #888; border-color: #cdcdcd; }
    body.light .content-textarea { background: #fff; border-color: #d0d0d0; color: #1a1a1a; }
    body.light .content-textarea::placeholder { color: #aaa; }
    body.light .char-count { color: #999; }
    body.light .summary-result { background: #fff; border-color: #e0e0e0; color: #222; }
    body.light .summary-result h1, body.light .summary-result h2, body.light .summary-result h3 { color: #111; }
    body.light .flashcard-front { background: #fff; border-color: #ddd; }
    body.light .flashcard-back { background: #fff2f2; border-color: #e6b8b8; }
    body.light .flashcard-text { color: #222; }
    body.light .flashcard-front .flashcard-label { color: #888; }
    body.light .flashcard-hint { color: #bbb; }
    body.light .dot { background: #cfcfcf; }
    body.light .dot.visited { background: #e6a8a8; }
    body.light .quiz-score { background: #fff; border-color: #e0e0e0; color: #555; }
    body.light .quiz-progress-bar { background: #dcdcdc; }
    body.light .quiz-question-card { background: #fff; border-color: #e0e0e0; }
    body.light .quiz-question-text { color: #111; }
    body.light .quiz-option { background: #fafafa; border-color: #e0e0e0; color: #333; }
    body.light .quiz-option:hover:not(.answered) { background: #fff2f2; color: #000; }
    body.light .quiz-option.selected { background: #ededed; color: #111; border-color: #aaa; }
    body.light .quiz-option.correct, body.light .quiz-option.reveal-correct { background: #eafaea; }
    body.light .quiz-option.wrong { background: #fdeaea; }
    body.light .option-letter { background: #e4e4e4; color: #777; }
    body.light .quiz-results { background: #fff; border-color: #e0e0e0; }
    body.light .results-title { color: #111; }
    body.light .stat-card, body.light .history-chart { background: #fff; border-color: #e0e0e0; }
    body.light .stats-section-title { color: #111; }
    body.light .section-divider { background: #e0e0e0; }
    body.light .empty-title { color: #777; }
    body.light .empty-desc { color: #999; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="app.js"></script>
</body>
</html>
