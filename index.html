<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dybass Estudioso</title>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="offline.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      display: flex;
      height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #c0392b; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #0f0f0f;
      border-right: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid #1a1a1a;
    }

    .sidebar-logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .sidebar-logo span {
      font-size: 11px;
      color: #8b0000;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: #161616;
      color: #ccc;
    }

    .nav-item.active {
      background: #1a0000;
      color: #fff;
      border-left: 3px solid #8b0000;
      padding-left: 11px;
    }

    .nav-item .nav-icon {
      font-size: 18px;
      width: 22px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid #1a1a1a;
      font-size: 11px;
      color: #333;
      text-align: center;
    }

    /* Main content */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 28px 36px 20px;
      border-bottom: 1px solid #141414;
      background: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .page-header p {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .page-content {
      padding: 28px 36px;
      flex: 1;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #8b0000;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #a00000;
    }

    .btn-secondary {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #222;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #222;
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: #8b0000;
      border: 1px solid #8b0000;
    }

    .btn-outline:hover:not(:disabled) {
      background: #8b0000;
      color: #fff;
    }

    /* Content section */
    .content-textarea {
      width: 100%;
      min-height: 400px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 15px;
      line-height: 1.7;
      padding: 20px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .content-textarea:focus {
      border-color: #8b0000;
    }

    .content-textarea::placeholder {
      color: #333;
    }

    .content-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .char-count {
      font-size: 12px;
      color: #444;
      margin-left: auto;
    }

    .saved-badge {
      font-size: 12px;
      color: #2d7a2d;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Summary section */
    .summary-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-result {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 24px;
      font-size: 15px;
      line-height: 1.8;
      color: #ddd;
      white-space: pre-wrap;
      min-height: 200px;
    }

    .summary-result h1, .summary-result h2, .summary-result h3 {
      color: #fff;
      margin: 16px 0 8px;
    }

    /* Resumo organizado por capítulos */
    .sum-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 8px;
    }
    .sum-chapter {
      font-size: 15px;
      font-weight: 700;
      color: #c0392b;
      margin: 22px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a0000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sum-chapter:first-of-type { margin-top: 8px; }
    .sum-para { color: #ddd; line-height: 1.8; margin: 0 0 6px; }
    .sum-bullet { color: #ddd; line-height: 1.7; margin: 4px 0; padding-left: 4px; }
    .sum-terms {
      color: #9a8; font-size: 13px; margin: 8px 0 4px;
      background: #0d140d; border-left: 3px solid #2d7a2d;
      padding: 8px 12px; border-radius: 4px;
    }
    body.light .sum-title { color: #111; }
    body.light .sum-chapter { color: #a01818; border-bottom-color: #f0cccc; }
    body.light .sum-para, body.light .sum-bullet { color: #333; }
    body.light .sum-terms { color: #2d5a2d; background: #eef7ee; }

    /* Seletor de capítulo (chips) */
    .chapter-bar {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 20px; align-items: center;
    }
    .chapter-bar-label { font-size: 12px; color: #666; margin-right: 4px; }
    .chip {
      padding: 6px 14px; border-radius: 20px; font-size: 13px;
      background: #141414; border: 1px solid #222; color: #999;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .chip:hover { border-color: #3a0000; color: #ccc; }
    .chip.active { background: #1a0000; border-color: #8b0000; color: #fff; }
    body.light .chip { background: #ececed; border-color: #dcdcdc; color: #666; }
    body.light .chip.active { background: #ffe3e3; border-color: #c0392b; color: #a01818; }
    .chapter-tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      color: #c0392b; background: #1a0000; border: 1px solid #3a0000;
      padding: 2px 10px; border-radius: 12px; margin-bottom: 12px;
    }
    body.light .chapter-tag { background: #ffe3e3; border-color: #f0cccc; color: #a01818; }

    /* Flashcards section */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .flashcard-progress {
      font-size: 13px;
      color: #555;
      align-self: flex-end;
    }

    .flashcard-scene {
      width: 100%;
      max-width: 640px;
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
    }

    .flashcard-front {
      background: #141414;
      border: 1px solid #222;
    }

    .flashcard-back {
      background: #140000;
      border: 1px solid #3a0000;
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .flashcard-front .flashcard-label { color: #888; }
    .flashcard-back .flashcard-label { color: #8b0000; }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.6;
      color: #e8e8e8;
    }

    .flashcard-hint {
      font-size: 12px;
      color: #333;
      margin-top: 20px;
    }

    .flashcard-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .flashcard-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 300px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #222;
      transition: background 0.2s;
    }

    .dot.active { background: #8b0000; }
    .dot.visited { background: #3a0000; }

    /* Quiz section */
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .quiz-score {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      color: #888;
    }

    .quiz-score strong {
      color: #c0392b;
      font-size: 16px;
    }

    .quiz-progress-bar {
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      background: #8b0000;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .quiz-question-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .quiz-question-num {
      font-size: 11px;
      color: #8b0000;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .quiz-question-text {
      font-size: 17px;
      color: #fff;
      line-height: 1.6;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #1e1e1e;
      background: #0f0f0f;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      color: #ccc;
      font-size: 15px;
      line-height: 1.5;
    }

    .quiz-option:hover:not(.answered) {
      border-color: #3a0000;
      background: #120000;
      color: #fff;
    }

    .quiz-option.selected {
      border-color: #555;
      background: #161616;
      color: #fff;
    }

    .quiz-option.correct {
      border-color: #2d7a2d;
      background: #0a1a0a;
      color: #5cb85c;
    }

    .quiz-option.wrong {
      border-color: #7a0000;
      background: #1a0000;
      color: #e05555;
    }

    .quiz-option.reveal-correct {
      border-color: #2d7a2d;
      background: #0a1a0a;
      color: #5cb85c;
    }

    .option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #1a1a1a;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .quiz-option.correct .option-letter,
    .quiz-option.reveal-correct .option-letter {
      background: #1a3a1a;
      color: #5cb85c;
    }

    .quiz-option.wrong .option-letter { background: #3a0000; color: #e05555; }

    .quiz-feedback {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-feedback.correct { background: #0a1a0a; color: #5cb85c; border: 1px solid #2d7a2d; }
    .quiz-feedback.wrong { background: #1a0000; color: #e05555; border: 1px solid #7a0000; }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Results */
    .quiz-results {
      text-align: center;
      padding: 48px 24px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
    }

    .results-emoji {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .results-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .results-score {
      font-size: 48px;
      font-weight: 800;
      color: #c0392b;
      margin: 20px 0;
    }

    .results-detail {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
    }

    /* Empty / loading states */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      color: #333;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-title {
      font-size: 16px;
      color: #444;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      color: #333;
      max-width: 320px;
      line-height: 1.6;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-banner {
      background: #1a0000;
      border: 1px solid #7a0000;
      border-radius: 10px;
      padding: 14px 18px;
      color: #e05555;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-divider {
      height: 1px;
      background: #141414;
      margin: 24px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-red { background: #1a0000; color: #c0392b; border: 1px solid #3a0000; }
    .badge-offline { background: #0a1a0a; color: #5cb85c; border: 1px solid #1a3a1a; }

    /* Mode toggle in sidebar */
    .mode-toggle {
      padding: 14px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mode-label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #2a2a2a;
      border-radius: 22px;
      transition: 0.2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #ccc;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider { background: #2d7a2d; }
    input:checked + .slider:before { transform: translateX(18px); background: #fff; }

    .mode-hint {
      font-size: 10px;
      color: #444;
      line-height: 1.4;
    }

    .export-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 12px;
    }

    .export-toast {
      font-size: 12px;
      color: #5cb85c;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Statistics */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #c0392b;
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin: 8px 0 16px;
    }

    .history-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 160px;
      padding: 16px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .history-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .history-bar {
      width: 100%;
      max-width: 36px;
      background: linear-gradient(180deg, #c0392b, #8b0000);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.3s;
    }

    .history-bar-val { font-size: 11px; color: #888; }
    .history-bar-date { font-size: 9px; color: #444; }

    .btn-danger {
      background: transparent;
      color: #777;
      border: 1px solid #2a2a2a;
    }
    .btn-danger:hover:not(:disabled) { color: #e05555; border-color: #7a0000; }

    .btn-success {
      background: #1a3a1a;
      color: #5cb85c;
      border: 1px solid #2d7a2d;
    }
    .btn-success:hover:not(:disabled) { background: #234d23; color: #7ed87e; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .search-icon { font-size: 13px; opacity: 0.6; }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 14px;
      font-family: inherit;
    }

    .search-input::placeholder { color: #444; }

    .search-count {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    body.light .search-bar { background: #fff; border-color: #e0e0e0; }
    body.light .search-input { color: #1a1a1a; }
    body.light .search-input::placeholder { color: #aaa; }

    /* ─── Onboarding / Boas-vindas ───────────────────────────────────────── */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .onboarding-card {
      width: 90%;
      max-width: 480px;
      background: #121212;
      border: 1px solid #2a0000;
      border-radius: 16px;
      padding: 36px 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(139, 0, 0, 0.25);
    }

    body.light .onboarding-card { background: #fff; border-color: #e6b8b8; }

    .onboarding-emoji { font-size: 56px; margin-bottom: 18px; }

    .onboarding-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    body.light .onboarding-title { color: #111; }

    .onboarding-text {
      font-size: 15px;
      line-height: 1.7;
      color: #aaa;
      margin-bottom: 28px;
      min-height: 96px;
    }
    body.light .onboarding-text { color: #555; }

    .onboarding-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .onboarding-dot {
      width: 9px;

      border-radius: 50%;

    .onboarding-dot.active { background: #c0392b; width: 24px; border-radius: 5px; }

    .onboarding-nav {
      display: flex;

    .onboarding-skip {

      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      opacity: 0.7;
      font-family: inherit;
    }
    .help-btn:hover { opacity: 1; }

    /* ─── Tema claro (preto vira branco; vermelho permanece) ─────────────── */
    body.light { background: #f4f4f5; color: #1a1a1a; }
    body.light ::-webkit-scrollbar-track { background: #e0e0e0; }
    body.light .sidebar { background: #ececed; border-right-color: #dcdcdc; }
    body.light .sidebar-logo { border-bottom-color: #dcdcdc; }
    body.light .sidebar-logo h1 { color: #111; }
    body.light .nav-item { color: #666; }
    body.light .nav-item:hover { background: #e0e0e0; color: #222; }
    body.light .nav-item.active { background: #ffe3e3; color: #111; }
    body.light .sidebar-footer { color: #999; border-top-color: #dcdcdc; }
    body.light .mode-toggle { border-top-color: #dcdcdc; }
    body.light .mode-label { color: #555; }
    body.light .mode-hint { color: #999; }
    body.light .slider { background: #c4c4c4; }
    body.light .page-header { background: #f4f4f5; border-bottom-color: #e0e0e0; }
    body.light .page-header h2 { color: #111; }
    body.light .page-header p { color: #888; }
    body.light .btn-secondary { background: #e6e6e6; color: #333; border-color: #cdcdcd; }
    body.light .btn-secondary:hover:not(:disabled) { background: #dadada; color: #000; }
    body.light .btn-danger { color: #888; border-color: #cdcdcd; }
    body.light .content-textarea { background: #fff; border-color: #d0d0d0; color: #1a1a1a; }
    body.light .content-textarea::placeholder { color: #aaa; }
    body.light .char-count { color: #999; }
    body.light .summary-result { background: #fff; border-color: #e0e0e0; color: #222; }
    body.light .summary-result h1, body.light .summary-result h2, body.light .summary-result h3 { color: #111; }
    body.light .flashcard-front { background: #fff; border-color: #ddd; }
    body.light .flashcard-back { background: #fff2f2; border-color: #e6b8b8; }
    body.light .flashcard-text { color: #222; }
    body.light .flashcard-front .flashcard-label { color: #888; }
    body.light .flashcard-hint { color: #bbb; }
    body.light .dot { background: #cfcfcf; }
    body.light .dot.visited { background: #e6a8a8; }
    body.light .quiz-score { background: #fff; border-color: #e0e0e0; color: #555; }
    body.light .quiz-progress-bar { background: #dcdcdc; }
    body.light .quiz-question-card { background: #fff; border-color: #e0e0e0; }
    body.light .quiz-question-text { color: #111; }
    body.light .quiz-option { background: #fafafa; border-color: #e0e0e0; color: #333; }
    body.light .quiz-option:hover:not(.answered) { background: #fff2f2; color: #000; }
    body.light .quiz-option.selected { background: #ededed; color: #111; border-color: #aaa; }
    body.light .quiz-option.correct, body.light .quiz-option.reveal-correct { background: #eafaea; }
    body.light .quiz-option.wrong { background: #fdeaea; }
    body.light .option-letter { background: #e4e4e4; color: #777; }
    body.light .quiz-results { background: #fff; border-color: #e0e0e0; }
    body.light .results-title { color: #111; }
    body.light .stat-card, body.light .history-chart { background: #fff; border-color: #e0e0e0; }
    body.light .stats-section-title { color: #111; }
    body.light .section-divider { background: #e0e0e0; }
    body.light .empty-title { color: #777; }
    body.light .empty-desc { color: #999; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ─── Icons ───────────────────────────────────────────────────────────────
    const icons = {
      content:    '📝',
      summary:    '📋',
      flashcards: '🃏',
      quiz:       '🎯',
      check:      '✓',
      cross:      '✕',
      left:       '←',
      right:      '→',
      refresh:    '↺',
      save:       '💾',
      brain:      '🧠',
      star:       '⭐',
      trophy:     '🏆',
      sad:        '😞',
      ok:         '👍',
      sparkle:    '✨',
      stats:      '📊',
      sun:        '☀️',
      moon:       '🌙',
      upload:     '📁',
      trash:      '🗑️',
    };

    // ─── Motor de IA (online via API ou offline local) ───────────────────────
    async function runAI(offline, method, ...args) {
      const engine = offline ? window.offlineAI : window.electronAPI;
      if (!engine || typeof engine[method] !== 'function') {
        return { success: false, error: offline
          ? 'Motor offline indisponível.'
          : 'API indisponível. Ative o Modo Offline na barra lateral.' };
      }
      return await Promise.resolve(engine[method](...args));
    }

    // ─── Exportação de arquivos ──────────────────────────────────────────────
    async function exportData(defaultName, content, mime) {
      // Em Electron usa o diálogo nativo; senão faz download via blob.
      if (window.electronAPI && window.electronAPI.exportFile) {
        const ext = defaultName.split('.').pop();
        const result = await window.electronAPI.exportFile({
          defaultName,
          content,
          filters: [{ name: ext.toUpperCase(), extensions: [ext] }],
        });
        return result;
      }
      try {
        const blob = new Blob([content], { type: mime || 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = defaultName;
        a.click();
        URL.revokeObjectURL(url);
        return { success: true };
      } catch (e) {
        return { success: false, error: e.message };
      }
    }

    function flashcardsToAnki(cards) {
      // Formato TSV compatível com importação do Anki: pergunta<TAB>resposta.
      return cards
        .map(c => {
          const front = String(c.front).replace(/\t/g, ' ').replace(/\n/g, '<br>');
          const back = String(c.back).replace(/\t/g, ' ').replace(/\n/g, '<br>');
          return front + '\t' + back;
        })
        .join('\n');
    }

    function flashcardsToCSV(cards) {
      const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
      return 'Pergunta,Resposta\n' +
        cards.map(c => esc(c.front) + ',' + esc(c.back)).join('\n');
    }

    // ─── Renderização do resumo organizado ───────────────────────────────────
    function renderSummary(text) {
      const lines = String(text).split('\n');
      const out = [];
      lines.forEach((raw, i) => {
        const line = raw.trimEnd();
        if (!line.trim()) return;
        if (line.startsWith('# ')) {
          out.push(<div className="sum-title" key={i}>{line.slice(2)}</div>);
        } else if (line.startsWith('## ')) {
          out.push(<div className="sum-chapter" key={i}>{icons.summary} {line.slice(3)}</div>);
        } else if (line.startsWith('★')) {
          out.push(<div className="sum-terms" key={i}>{line}</div>);
        } else if (line.startsWith('•')) {
          out.push(<div className="sum-bullet" key={i}>{line}</div>);
        } else {
          out.push(<div className="sum-para" key={i}>{line}</div>);
        }
      });
      return out;
    }

    // ─── Seletor de capítulos (chips) ────────────────────────────────────────
    function ChapterChips({ chapters, value, onChange }) {
      if (!chapters || chapters.length <= 1) return null;
      return (
        <div className="chapter-bar">
          <span className="chapter-bar-label">Capítulo:</span>
          <button className={`chip ${value === null ? 'active' : ''}`} onClick={() => onChange(null)}>
            Todos
          </button>
          {chapters.map((c, i) => (
            <button key={i} className={`chip ${value === c ? 'active' : ''}`} onClick={() => onChange(c)}>
              {c}
            </button>
          ))}
        </div>
      );
    }

    // Detecta capítulos do conteúdo (mesmo motor, funciona online e offline).
    function detectChaptersOf(content) {
      try {
        if (window.offlineAI && window.offlineAI.detectChapters) {
          return window.offlineAI.detectChapters(content).map(c => c.title);
        }
      } catch { /* ignora */ }
      return [];
    }

    // ─── Estatísticas de estudo ──────────────────────────────────────────────
    function loadStats() {
      try {
        return JSON.parse(localStorage.getItem('dybass_stats')) || {};
      } catch { return {}; }
    }

    function defaultStats() {
      return { quizzes: [], flashcardsGenerated: 0, summariesGenerated: 0 };
    }

    function getStats() {
      return Object.assign(defaultStats(), loadStats());
    }

    function saveStats(stats) {
      localStorage.setItem('dybass_stats', JSON.stringify(stats));
    }

    function recordQuiz(score, total) {
      const s = getStats();
      s.quizzes.push({ date: Date.now(), score, total, pct: Math.round((score / total) * 100) });
      if (s.quizzes.length > 100) s.quizzes = s.quizzes.slice(-100);
      saveStats(s);
    }

    function recordEvent(key) {
      const s = getStats();
      s[key] = (s[key] || 0) + 1;
      saveStats(s);
    }

    // ─── Importação de arquivos (TXT / PDF) ──────────────────────────────────
    async function extractTextFromFile(file) {
      const name = file.name.toLowerCase();
      if (name.endsWith('.pdf')) {
        if (!window.pdfjsLib) throw new Error('Leitor de PDF não carregou. Verifique a conexão.');
        const buf = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const tc = await page.getTextContent();
          text += tc.items.map(it => it.str).join(' ') + '\n\n';
        }
        return text.trim();
      }
      // TXT, MD e similares
      return await file.text();
    }

    // ─── Content Section ─────────────────────────────────────────────────────
    function ContentSection({ content, onContentChange }) {
      const [saved, setSaved] = useState(false);
      const [importing, setImporting] = useState(false);
      const [importError, setImportError] = useState('');
      const [search, setSearch] = useState('');
      const [matchIdx, setMatchIdx] = useState(0);
      const fileInputRef = React.useRef(null);
      const textareaRef = React.useRef(null);

      // Posições de todas as ocorrências da busca (case-insensitive).
      const matches = React.useMemo(() => {
        if (!search.trim()) return [];
        const out = [];
        const hay = content.toLowerCase();
        const needle = search.toLowerCase();
        let i = hay.indexOf(needle);
        while (i !== -1) {
          out.push(i);
          i = hay.indexOf(needle, i + needle.length);
        }
        return out;
      }, [search, content]);

      const jumpToMatch = (idx) => {
        if (matches.length === 0 || !textareaRef.current) return;
        const safe = ((idx % matches.length) + matches.length) % matches.length;
        setMatchIdx(safe);
        const start = matches[safe];
        const ta = textareaRef.current;
        ta.focus();
        ta.setSelectionRange(start, start + search.length);
        // Aproxima a seleção do topo visível da textarea.
        const before = content.slice(0, start).split('\n').length;
        const lineHeight = 26;
        ta.scrollTop = Math.max(0, (before - 3) * lineHeight);
      };

      const handleSave = () => {
        localStorage.setItem('dybass_content', content);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      };

      const handleImport = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setImporting(true);
        setImportError('');
        try {
          const text = await extractTextFromFile(file);
          if (!text.trim()) throw new Error('Nenhum texto extraído do arquivo.');
          // Acrescenta ao conteúdo existente (ou substitui se vazio).
          const merged = content.trim() ? content + '\n\n' + text : text;
          onContentChange(merged);
          localStorage.setItem('dybass_content', merged);
          setSaved(true);
          setTimeout(() => setSaved(false), 2000);
        } catch (err) {
          setImportError('Erro ao importar: ' + err.message);
        }
        setImporting(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      return (
        <div>
          <div className="page-header">
            <h2>Conteúdo de Estudo</h2>
            <p>Cole ou digite o material que deseja estudar</p>
          </div>
          <div className="page-content">
            {content.trim() && (
              <div className="search-bar">
                <span className="search-icon">🔍</span>
                <input
                  className="search-input"
                  type="text"
                  placeholder="Buscar no conteúdo..."
                  value={search}
                  onChange={e => { setSearch(e.target.value); setMatchIdx(0); }}
                  onKeyDown={e => { if (e.key === 'Enter') jumpToMatch(matchIdx + (e.shiftKey ? -1 : 1)); }}
                />
                {search.trim() && (
                  <React.Fragment>
                    <span className="search-count">
                      {matches.length ? `${matches.length} resultado(s)` : 'nada encontrado'}
                    </span>
                    <button className="btn btn-secondary btn-sm" onClick={() => jumpToMatch(matchIdx - 1)} disabled={!matches.length}>
                      {icons.left}
                    </button>
                    <button className="btn btn-secondary btn-sm" onClick={() => jumpToMatch(matchIdx + 1)} disabled={!matches.length}>
                      {icons.right}
                    </button>
                  </React.Fragment>
                )}
              </div>
            )}
            <textarea
              ref={textareaRef}
              className="content-textarea"
              value={content}
              onChange={e => onContentChange(e.target.value)}
              placeholder="Cole aqui seu conteúdo de estudo — textos, anotações, resumos de livros, artigos, etc.

O conteúdo será usado para gerar resumos, flashcards e questões automaticamente com inteligência artificial.

Quanto mais detalhado o conteúdo, melhores serão os materiais gerados."
            />
            <div className="content-actions">
              <button className="btn btn-primary" onClick={handleSave} disabled={!content.trim()}>
                {icons.save} Salvar Conteúdo
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".txt,.md,.text,.pdf"
                style={{display:'none'}}
                onChange={handleImport}
              />
              <button
                className="btn btn-secondary"
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                disabled={importing}
              >
                {importing ? <span className="loading-spinner" /> : icons.upload} Importar PDF/TXT
              </button>
              {saved && (
                <span className="saved-badge">
                  {icons.check} Salvo com sucesso
                </span>
              )}
              {content && (
                <span className="char-count">
                  {content.length.toLocaleString()} caracteres · {content.split(/\s+/).filter(Boolean).length.toLocaleString()} palavras
                </span>
              )}
            </div>

            {importError && (
              <div className="error-banner" style={{marginTop: 16}}>
                {icons.cross} {importError}
              </div>
            )}

            {!content.trim() && (
              <div className="empty-state" style={{marginTop: 32}}>
                <div className="empty-icon">{icons.brain}</div>
                <div className="empty-title">Nenhum conteúdo inserido</div>
                <div className="empty-desc">
                  Comece colando ou digitando o material de estudo acima. Use a barra lateral para navegar entre as seções após salvar.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Summary Section ──────────────────────────────────────────────────────
    function SummarySection({ content, offline }) {
      const [summary, setSummary] = useState(() => localStorage.getItem('dybass_summary') || '');
      const [summaryType, setSummaryType] = useState(() => localStorage.getItem('dybass_summary_type') || '');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const generate = async (type) => {
        if (!content.trim()) {
          setError('Adicione conteúdo de estudo na seção "Conteúdo" primeiro.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const result = await runAI(offline, 'generateSummary', content, type);
          if (result.success) {
            setSummary(result.data);
            setSummaryType(type);
            localStorage.setItem('dybass_summary', result.data);
            localStorage.setItem('dybass_summary_type', type);
            recordEvent('summariesGenerated');
          } else {
            setError('Erro ao gerar resumo: ' + result.error);
          }
        } catch (e) {
          setError('Erro de conexão. Verifique sua chave de API.');
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="page-header">
            <h2>Resumo</h2>
            <p>Resumo detalhado ou simplificado, organizado por capítulos/tópicos</p>
          </div>
          <div className="page-content">
            <div className="summary-actions">
              <button
                className="btn btn-primary"
                onClick={() => generate('completo')}
                disabled={loading}
              >
                {loading && summaryType !== 'simples' ? <span className="loading-spinner" /> : icons.sparkle}
                Resumo Completo
              </button>
              <button
                className="btn btn-outline"
                onClick={() => generate('simples')}
                disabled={loading}
              >
                {loading && summaryType === 'simples' ? <span className="loading-spinner" /> : '•'}
                Resumo Simples
              </button>
              {summary && !loading && (
                <span className="badge badge-red" style={{marginLeft: 'auto'}}>
                  {summaryType === 'completo' ? 'Completo' : 'Simples'}
                </span>
              )}
            </div>

            {error && (
              <div className="error-banner">
                {icons.cross} {error}
              </div>
            )}

            {loading && (
              <div className="empty-state">
                <span className="loading-spinner" style={{width:36, height:36, borderWidth:3, marginBottom:16}} />
                <div className="empty-title">Gerando resumo...</div>
                <div className="empty-desc">A IA está processando seu conteúdo</div>
              </div>
            )}

            {!loading && summary && (
              <div className="summary-result">{renderSummary(summary)}</div>
            )}

            {!loading && !summary && !error && (
              <div className="empty-state">
                <div className="empty-icon">{icons.summary}</div>
                <div className="empty-title">Nenhum resumo gerado</div>
                <div className="empty-desc">
                  Clique em "Resumo Completo" para um resumo detalhado ou "Resumo Simples" para bullet points rápidos.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Flashcards Section ───────────────────────────────────────────────────
    function FlashcardsSection({ content, offline }) {
      const [exportMsg, setExportMsg] = useState('');
      const [cards, setCards] = useState(() => {
        try { return JSON.parse(localStorage.getItem('dybass_flashcards') || '[]'); } catch { return []; }
      });
      const [current, setCurrent] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [visited, setVisited] = useState(new Set());
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      // Revisão espaçada (sessão): fila de cartões a revisar.
      const [reviewMode, setReviewMode] = useState(false);
      const [queue, setQueue] = useState([]);
      const [reviewStats, setReviewStats] = useState({ good: 0, again: 0 });
      const [chapterFilter, setChapterFilter] = useState(null);

      const chapters = React.useMemo(() => {
        const list = [];
        cards.forEach(c => { if (c.chapter && !list.includes(c.chapter)) list.push(c.chapter); });
        return list;
      }, [cards]);

      const visibleCards = React.useMemo(() =>
        chapterFilter ? cards.filter(c => c.chapter === chapterFilter) : cards,
        [cards, chapterFilter]);

      // Ao trocar de capítulo, reinicia a navegação e sai da revisão.
      useEffect(() => {
        setCurrent(0);
        setFlipped(false);
        setReviewMode(false);
        setQueue([]);
      }, [chapterFilter]);

      const startReview = () => {
        setQueue(visibleCards.map((_, i) => i));
        setReviewStats({ good: 0, again: 0 });
        setReviewMode(true);
        setFlipped(false);
      };

      const exitReview = () => {
        setReviewMode(false);
        setQueue([]);
        setFlipped(false);
      };

      // Acertei: remove o cartão da fila. Errei: manda para o fim (revisa depois).
      const rateCard = (good) => {
        setReviewStats(s => good ? { ...s, good: s.good + 1 } : { ...s, again: s.again + 1 });
        setQueue(q => {
          const [head, ...rest] = q;
          return good ? rest : [...rest, head];
        });
        setFlipped(false);
      };

      const generate = async () => {
        if (!content.trim()) {
          setError('Adicione conteúdo de estudo na seção "Conteúdo" primeiro.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const result = await runAI(offline, 'generateFlashcards', content);
          if (result.success) {
            setCards(result.data);
            setChapterFilter(null);
            setCurrent(0);
            setFlipped(false);
            setVisited(new Set());
            setReviewMode(false);
            setQueue([]);
            localStorage.setItem('dybass_flashcards', JSON.stringify(result.data));
            recordEvent('flashcardsGenerated');
          } else {
            setError('Erro ao gerar flashcards: ' + result.error);
          }
        } catch (e) {
          setError('Erro de conexão. Verifique sua chave de API.');
        }
        setLoading(false);
      };

      const goTo = (idx) => {
        setVisited(v => new Set([...v, current]));
        setCurrent(idx);
        setFlipped(false);
      };

      const prev = () => { if (current > 0) goTo(current - 1); };
      const next = () => { if (current < visibleCards.length - 1) goTo(current + 1); };

      // Atalhos de teclado: ←/→ navegar, Espaço/Enter virar, 1=Errei 2=Acertei.
      useEffect(() => {
        if (loading || visibleCards.length === 0) return;
        const onKey = (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            setFlipped(f => !f);
          } else if (reviewMode && queue.length > 0) {
            if (e.key === '1') rateCard(false);
            else if (e.key === '2') rateCard(true);
          } else if (!reviewMode) {
            if (e.key === 'ArrowLeft') prev();
            else if (e.key === 'ArrowRight') next();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [loading, visibleCards.length, reviewMode, queue, current]);

      const doExport = async (format) => {
        if (!cards.length) return;
        let name, data, mime;
        if (format === 'anki') {
          name = 'flashcards-dybass-anki.txt';
          data = flashcardsToAnki(cards);
          mime = 'text/plain';
        } else if (format === 'csv') {
          name = 'flashcards-dybass.csv';
          data = flashcardsToCSV(cards);
          mime = 'text/csv';
        } else {
          name = 'flashcards-dybass.json';
          data = JSON.stringify(cards, null, 2);
          mime = 'application/json';
        }
        const res = await exportData(name, data, mime);
        if (res.success) {
          setExportMsg('Exportado!');
          setTimeout(() => setExportMsg(''), 2500);
        } else if (!res.canceled) {
          setExportMsg('Falha ao exportar');
          setTimeout(() => setExportMsg(''), 2500);
        }
      };

      const reviewIdx = reviewMode && queue.length > 0 ? queue[0] : null;
      const card = reviewMode ? visibleCards[reviewIdx] : visibleCards[current];

      return (
        <div>
          <div className="page-header">
            <h2>Flashcards</h2>
            <p>Estude com cartões — clique para virar · ← → navega · Espaço vira</p>
          </div>
          <div className="page-content">
            <div className="export-bar" style={{marginBottom:24}}>
              <button className="btn btn-primary" onClick={generate} disabled={loading}>
                {loading ? <span className="loading-spinner" /> : icons.sparkle}
                {cards.length ? 'Gerar Novos' : 'Gerar Flashcards'}
              </button>
              {cards.length > 0 && !loading && !reviewMode && (
                <button className="btn btn-outline" onClick={startReview} title="Estuda em ciclo até acertar todos">
                  {icons.brain} Modo Revisão
                </button>
              )}
              {cards.length > 0 && !loading && reviewMode && (
                <button className="btn btn-secondary" onClick={exitReview}>
                  {icons.left} Sair da Revisão
                </button>
              )}
              {cards.length > 0 && !loading && !reviewMode && (
                <React.Fragment>
                  <div style={{width:1, height:24, background:'#222', margin:'0 4px'}} />
                  <span style={{fontSize:12, color:'#555'}}>Exportar:</span>
                  <button className="btn btn-secondary btn-sm" onClick={() => doExport('anki')} title="Arquivo de texto para importar no Anki">
                    {icons.save} Anki
                  </button>
                  <button className="btn btn-secondary btn-sm" onClick={() => doExport('csv')} title="Planilha CSV">
                    {icons.save} CSV
                  </button>
                  <button className="btn btn-secondary btn-sm" onClick={() => doExport('json')} title="Arquivo JSON">
                    {icons.save} JSON
                  </button>
                  {exportMsg && <span className="export-toast">{icons.check} {exportMsg}</span>}
                </React.Fragment>
              )}
            </div>

            {!loading && cards.length > 0 && !reviewMode && (
              <ChapterChips chapters={chapters} value={chapterFilter} onChange={setChapterFilter} />
            )}

            {error && (
              <div className="error-banner">
                {icons.cross} {error}
              </div>
            )}

            {loading && (
              <div className="empty-state">
                <span className="loading-spinner" style={{width:36, height:36, borderWidth:3, marginBottom:16}} />
                <div className="empty-title">Gerando flashcards...</div>
                <div className="empty-desc">Criando cartões organizados por capítulo</div>
              </div>
            )}

            {!loading && cards.length > 0 && reviewMode && queue.length === 0 && (
              <div className="quiz-results">
                <div className="results-emoji">{icons.trophy}</div>
                <div className="results-title">Revisão concluída!</div>
                <div className="results-detail" style={{marginTop:12}}>
                  Você revisou todos os {visibleCards.length} cartões.
                  {reviewStats.again > 0 && ` Repetiu ${reviewStats.again}x os difíceis.`}
                </div>
                <div style={{display:'flex', gap:12, justifyContent:'center', marginTop:24}}>
                  <button className="btn btn-primary" onClick={startReview}>
                    {icons.refresh} Revisar de Novo
                  </button>
                  <button className="btn btn-secondary" onClick={exitReview}>
                    Voltar
                  </button>
                </div>
              </div>
            )}

            {!loading && cards.length > 0 && !(reviewMode && queue.length === 0) && (
              <div className="flashcard-container">
                <div className="flashcard-progress">
                  {reviewMode
                    ? `Revisão · faltam ${queue.length} · ✓ ${reviewStats.good} · ↺ ${reviewStats.again}`
                    : `${current + 1} / ${visibleCards.length}`}
                </div>

                {card && card.chapter && (
                  <div className="chapter-tag">{card.chapter}</div>
                )}

                <div
                  className="flashcard-scene"
                  onClick={() => setFlipped(f => !f)}
                >
                  <div className={`flashcard-inner ${flipped ? 'flipped' : ''}`}>
                    <div className="flashcard-face flashcard-front">
                      <div className="flashcard-label">Pergunta</div>
                      <div className="flashcard-text">{card.front}</div>
                      <div className="flashcard-hint">Clique para ver a resposta</div>
                    </div>
                    <div className="flashcard-face flashcard-back">
                      <div className="flashcard-label">Resposta</div>
                      <div className="flashcard-text">{card.back}</div>
                    </div>
                  </div>
                </div>

                {reviewMode ? (
                  <div className="flashcard-nav" style={{justifyContent:'center', gap:12}}>
                    <button className="btn btn-outline" onClick={() => rateCard(false)} title="Tecla 1">
                      {icons.refresh} Errei (revisar)
                    </button>
                    <button className="btn btn-success" onClick={() => rateCard(true)} title="Tecla 2">
                      {icons.check} Acertei
                    </button>
                  </div>
                ) : (
                  <div className="flashcard-nav">
                    <button className="btn btn-secondary" onClick={prev} disabled={current === 0}>
                      {icons.left} Anterior
                    </button>
                    <div className="flashcard-dots">
                      {visibleCards.map((_, i) => (
                        <div
                          key={i}
                          className={`dot ${i === current ? 'active' : visited.has(i) ? 'visited' : ''}`}
                          onClick={() => goTo(i)}
                          style={{cursor:'pointer'}}
                          title={`Card ${i+1}`}
                        />
                      ))}
                    </div>
                    <button className="btn btn-secondary" onClick={next} disabled={current === visibleCards.length - 1}>
                      Próximo {icons.right}
                    </button>
                  </div>
                )}
              </div>
            )}

            {!loading && cards.length === 0 && !error && (
              <div className="empty-state">
                <div className="empty-icon">{icons.flashcards}</div>
                <div className="empty-title">Nenhum flashcard gerado</div>
                <div className="empty-desc">
                  Clique em "Gerar Flashcards" para criar 10 cartões de pergunta e resposta a partir do seu conteúdo.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Quiz Section ─────────────────────────────────────────────────────────
    function QuizSection({ content, offline }) {
      const [questions, setQuestions] = useState(() => {
        try { return JSON.parse(localStorage.getItem('dybass_quiz') || '[]'); } catch { return []; }
      });
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [score, setScore] = useState(0);
      const [finished, setFinished] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [chapterFilter, setChapterFilter] = useState(null);

      const chapters = React.useMemo(() => {
        const list = [];
        questions.forEach(q => { if (q.chapter && !list.includes(q.chapter)) list.push(q.chapter); });
        return list;
      }, [questions]);

      const visibleQuestions = React.useMemo(() =>
        chapterFilter ? questions.filter(q => q.chapter === chapterFilter) : questions,
        [questions, chapterFilter]);

      const generate = async () => {
        if (!content.trim()) {
          setError('Adicione conteúdo de estudo na seção "Conteúdo" primeiro.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const result = await runAI(offline, 'generateQuiz', content);
          if (result.success) {
            setQuestions(result.data);
            setChapterFilter(null);
            localStorage.setItem('dybass_quiz', JSON.stringify(result.data));
            resetQuiz();
          } else {
            setError('Erro ao gerar quiz: ' + result.error);
          }
        } catch (e) {
          setError('Erro de conexão. Verifique sua chave de API.');
        }
        setLoading(false);
      };

      const resetQuiz = () => {
        setCurrent(0);
        setSelected(null);
        setAnswered(false);
        setScore(0);
        setFinished(false);
      };

      // Reinicia o quiz ao trocar de capítulo.
      useEffect(() => { resetQuiz(); }, [chapterFilter]);

      const handleSelect = (idx) => {
        if (answered) return;
        setSelected(idx);
        setAnswered(true);
        if (idx === visibleQuestions[current].correct) {
          setScore(s => s + 1);
        }
      };

      const handleNext = () => {
        if (current < visibleQuestions.length - 1) {
          setCurrent(c => c + 1);
          setSelected(null);
          setAnswered(false);
        } else {
          recordQuiz(score, visibleQuestions.length);
          setFinished(true);
        }
      };

      const q = visibleQuestions[current];
      const optLetters = ['A', 'B', 'C', 'D'];

      // Atalhos: 1-4 (ou A-D) escolhem a opção, Enter avança.
      useEffect(() => {
        if (loading || finished || visibleQuestions.length === 0) return;
        const onKey = (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          const cur = visibleQuestions[current];
          if (!cur) return;
          if (!answered) {
            const map = { '1':0, '2':1, '3':2, '4':3, 'a':0, 'b':1, 'c':2, 'd':3 };
            const idx = map[e.key.toLowerCase()];
            if (idx !== undefined && idx < cur.options.length) handleSelect(idx);
          } else if (e.code === 'Enter' || e.code === 'Space') {
            e.preventDefault();
            handleNext();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [loading, finished, answered, current, visibleQuestions]);

      const getPercentage = () => Math.round((score / visibleQuestions.length) * 100);
      const getResultEmoji = () => {
        const p = getPercentage();
        if (p >= 90) return icons.trophy;
        if (p >= 70) return icons.star;
        if (p >= 50) return icons.ok;
        return icons.sad;
      };

      return (
        <div>
          <div className="page-header">
            <h2>Quiz</h2>
            <p>Teste seus conhecimentos com questões de múltipla escolha</p>
          </div>
          <div className="page-content">
            {error && (
              <div className="error-banner">
                {icons.cross} {error}
              </div>
            )}

            {!loading && !finished && questions.length > 0 && (
              <div className="quiz-header">
                <div className="quiz-score">
                  Acertos: <strong>{score}</strong>/{visibleQuestions.length}
                </div>
                <button className="btn btn-secondary" onClick={generate} disabled={loading}>
                  {icons.refresh} Novo Quiz
                </button>
              </div>
            )}

            {!loading && !finished && questions.length > 0 && (
              <ChapterChips chapters={chapters} value={chapterFilter} onChange={setChapterFilter} />
            )}

            {loading && (
              <div className="empty-state">
                <span className="loading-spinner" style={{width:36, height:36, borderWidth:3, marginBottom:16}} />
                <div className="empty-title">Gerando quiz...</div>
                <div className="empty-desc">Criando questões organizadas por capítulo</div>
              </div>
            )}

            {!loading && questions.length === 0 && !error && (
              <div className="empty-state">
                <div className="empty-icon">{icons.quiz}</div>
                <div className="empty-title">Nenhum quiz gerado</div>
                <div className="empty-desc">
                  Clique em "Gerar Quiz" para criar 8 questões de múltipla escolha sobre o seu conteúdo.
                </div>
                <button className="btn btn-primary" style={{marginTop:20}} onClick={generate}>
                  {icons.sparkle} Gerar Quiz
                </button>
              </div>
            )}

            {!loading && questions.length > 0 && !finished && q && (
              <div>
                <div className="quiz-progress-bar">
                  <div
                    className="quiz-progress-fill"
                    style={{width: `${((current) / visibleQuestions.length) * 100}%`}}
                  />
                </div>

                <div className="quiz-question-card">
                  {q.chapter && <div className="chapter-tag">{q.chapter}</div>}
                  <div className="quiz-question-num">Questão {current + 1} de {visibleQuestions.length}</div>
                  <div className="quiz-question-text">{q.question}</div>
                </div>

                <div className="quiz-options">
                  {q.options.map((opt, i) => {
                    let cls = 'quiz-option';
                    if (answered) {
                      cls += ' answered';
                      if (i === q.correct) cls += ' correct';
                      else if (i === selected && i !== q.correct) cls += ' wrong';
                    } else if (i === selected) {
                      cls += ' selected';
                    }
                    return (
                      <button
                        key={i}
                        className={cls}
                        onClick={() => handleSelect(i)}
                        disabled={answered}
                      >
                        <span className="option-letter">{optLetters[i]}</span>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {answered && (
                  <div className={`quiz-feedback ${selected === q.correct ? 'correct' : 'wrong'}`}>
                    {selected === q.correct
                      ? `${icons.check} Correto! Muito bem!`
                      : `${icons.cross} Incorreto. A resposta correta era: ${optLetters[q.correct]}`
                    }
                  </div>
                )}

                <div className="quiz-nav">
                  <span style={{fontSize:13, color:'#444'}}>
                    {answered ? (selected === q.correct ? '✓ Acertou' : '✕ Errou') : 'Selecione uma opção'}
                  </span>
                  <button
                    className="btn btn-primary"
                    onClick={handleNext}
                    disabled={!answered}
                  >
                    {current < visibleQuestions.length - 1 ? 'Próxima' : 'Ver Resultado'} {icons.right}
                  </button>
                </div>
              </div>
            )}

            {!loading && finished && (
              <div className="quiz-results">
                <div className="results-emoji">{getResultEmoji()}</div>
                <div className="results-title">
                  {getPercentage() >= 70 ? 'Parabéns!' : 'Continue estudando!'}
                </div>
                <div className="results-score">{getPercentage()}%</div>
                <div className="results-detail">
                  Você acertou {score} de {visibleQuestions.length} questões
                </div>
                <div style={{display:'flex', gap:12, justifyContent:'center'}}>
                  <button className="btn btn-secondary" onClick={resetQuiz}>
                    {icons.refresh} Refazer Quiz
                  </button>
                  <button className="btn btn-primary" onClick={generate}>
                    {icons.sparkle} Novo Quiz
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Statistics Section ───────────────────────────────────────────────────
    function StatsSection() {
      const [stats, setStats] = useState(() => getStats());

      const quizzes = stats.quizzes || [];
      const totalQuizzes = quizzes.length;
      const avgPct = totalQuizzes
        ? Math.round(quizzes.reduce((s, q) => s + q.pct, 0) / totalQuizzes)
        : 0;
      const bestPct = totalQuizzes ? Math.max(...quizzes.map(q => q.pct)) : 0;
      const recent = quizzes.slice(-12);

      const reset = () => {
        if (confirm('Apagar todo o histórico de estatísticas?')) {
          saveStats(defaultStats());
          setStats(getStats());
        }
      };

      const fmtDate = (ts) => {
        const d = new Date(ts);
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
      };

      return (
        <div>
          <div className="page-header">
            <h2>Estatísticas</h2>
            <p>Acompanhe seu progresso de estudo</p>
          </div>
          <div className="page-content">
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-value">{totalQuizzes}</div>
                <div className="stat-label">Quizzes feitos</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{avgPct}%</div>
                <div className="stat-label">Acerto médio</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{bestPct}%</div>
                <div className="stat-label">Melhor resultado</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.flashcardsGenerated || 0}</div>
                <div className="stat-label">Flashcards gerados</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.summariesGenerated || 0}</div>
                <div className="stat-label">Resumos gerados</div>
              </div>
            </div>

            <div className="stats-section-title">Evolução nos últimos quizzes</div>
            {recent.length > 0 ? (
              <div className="history-chart">
                {recent.map((q, i) => (
                  <div className="history-bar-wrap" key={i} title={`${q.score}/${q.total}`}>
                    <span className="history-bar-val">{q.pct}%</span>
                    <div className="history-bar" style={{height: `${Math.max(q.pct, 3)}%`}} />
                    <span className="history-bar-date">{fmtDate(q.date)}</span>
                  </div>
                ))}
              </div>
            ) : (
              <div className="empty-state">
                <div className="empty-icon">{icons.stats}</div>
                <div className="empty-title">Ainda sem dados</div>
                <div className="empty-desc">
                  Faça um quiz na seção "Quiz" para começar a registrar seu progresso.
                </div>
              </div>
            )}

            {totalQuizzes > 0 && (
              <button className="btn btn-danger btn-sm" onClick={reset}>
                {icons.trash} Limpar estatísticas
              </button>
            )}
          </div>
        </div>
      );
    }

    // ─── Onboarding / Tela de boas-vindas ────────────────────────────────────
    function Onboarding({ onClose }) {
      const steps = [
        {
          emoji: '🎓',
          title: 'Bem-vindo ao Dybass Estudioso!',
          text: 'Seu assistente de estudos. A partir de qualquer conteúdo, ele cria resumos, flashcards e quizzes para você aprender mais rápido. Vamos dar uma volta rápida?',
        },
        {
          emoji: '📝',
          title: '1. Insira seu conteúdo',
          text: 'Na seção Conteúdo, cole seu material ou importe um arquivo PDF/TXT. Use a busca para encontrar trechos. Tudo é salvo automaticamente.',
        },
        {
          emoji: '✨',
          title: '2. Gere material de estudo',
          text: 'Crie Resumos (completo ou simples), Flashcards e Quizzes com um clique. O quiz pode ser renovado quantas vezes quiser para manter a variedade.',
        },
        {
          emoji: '🔌',
          title: '3. Online ou Offline',
          text: 'No Modo Online usamos a IA Claude (precisa de chave de API). No Modo Offline tudo é gerado localmente, sem internet. Alterne na barra lateral.',
        },
        {
          emoji: '🔁',
          title: '4. Revise e acompanhe',
          text: 'Use o Modo Revisão dos flashcards para repetir os difíceis, e veja seu progresso na seção Estatísticas. Atalhos de teclado deixam tudo mais rápido!',
        },
      ];
      const [step, setStep] = useState(0);
      const last = step === steps.length - 1;

      const finish = () => {
        localStorage.setItem('dybass_onboarded', 'true');
        onClose();
      };

      const s = steps[step];
      return (
        <div className="onboarding-overlay">
          <div className="onboarding-card">
            <div className="onboarding-emoji">{s.emoji}</div>
            <div className="onboarding-title">{s.title}</div>
            <div className="onboarding-text">{s.text}</div>
            <div className="onboarding-dots">
              {steps.map((_, i) => (
                <div key={i} className={`onboarding-dot ${i === step ? 'active' : ''}`} />
              ))}
            </div>
            <div className="onboarding-nav">
              <button className="onboarding-skip" onClick={finish}>Pular</button>
              <div style={{display:'flex', gap:10}}>
                {step > 0 && (
                  <button className="btn btn-secondary" onClick={() => setStep(step - 1)}>
                    {icons.left} Voltar
                  </button>
                )}
                <button className="btn btn-primary" onClick={() => last ? finish() : setStep(step + 1)}>
                  {last ? `${icons.sparkle} Começar` : `Próximo ${icons.right}`}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── App Root ─────────────────────────────────────────────────────────────
    function App() {
      const [section, setSection] = useState('content');
      const [content, setContent] = useState(() => localStorage.getItem('dybass_content') || '');
      const [offline, setOffline] = useState(() => localStorage.getItem('dybass_offline') === 'true');
      const [theme, setTheme] = useState(() => localStorage.getItem('dybass_theme') || 'dark');
      const [showOnboarding, setShowOnboarding] = useState(() => localStorage.getItem('dybass_onboarded') !== 'true');

      // Aplica o tema ao <body>.
      useEffect(() => {
        document.body.classList.toggle('light', theme === 'light');
        localStorage.setItem('dybass_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

      // Se não houver chave de API configurada, ativa o modo offline por padrão.
      useEffect(() => {
        if (localStorage.getItem('dybass_offline') === null && window.electronAPI && window.electronAPI.hasApiKey) {
          window.electronAPI.hasApiKey().then(has => {
            if (!has) {
              setOffline(true);
              localStorage.setItem('dybass_offline', 'true');
            }
          });
        }
      }, []);

      const toggleOffline = () => {
        setOffline(prev => {
          const next = !prev;
          localStorage.setItem('dybass_offline', String(next));
          return next;
        });
      };

      const handleContentChange = (val) => {
        setContent(val);
      };

      const navItems = [
        { id: 'content',    label: 'Conteúdo',   icon: icons.content },
        { id: 'summary',    label: 'Resumo',      icon: icons.summary },
        { id: 'flashcards', label: 'Flashcards',  icon: icons.flashcards },
        { id: 'quiz',       label: 'Quiz',        icon: icons.quiz },
        { id: 'stats',      label: 'Estatísticas', icon: icons.stats },
      ];

      return (
        <div id="root" style={{display:'flex', height:'100vh', width:'100%'}}>
          {showOnboarding && <Onboarding onClose={() => setShowOnboarding(false)} />}
          {/* Sidebar */}
          <div className="sidebar">
            <div className="sidebar-logo">
              <h1>Dybass</h1>
              <span>Estudioso</span>
            </div>
            <nav className="sidebar-nav">
              {navItems.map(item => (
                <button
                  key={item.id}
                  className={`nav-item ${section === item.id ? 'active' : ''}`}
                  onClick={() => setSection(item.id)}
                >
                  <span className="nav-icon">{item.icon}</span>
                  {item.label}
                </button>
              ))}
            </nav>
            <div className="mode-toggle">
              <div className="mode-toggle-row">
                <span className="mode-label">
                  {theme === 'dark' ? '🌙 Tema Escuro' : '☀️ Tema Claro'}
                </span>
                <label className="switch">
                  <input type="checkbox" checked={theme === 'light'} onChange={toggleTheme} />
                  <span className="slider" />
                </label>
              </div>
              <div className="mode-toggle-row">
                <span className="mode-label">
                  {offline ? '🔌 Modo Offline' : '☁️ Modo Online'}
                </span>
                <label className="switch">
                  <input type="checkbox" checked={offline} onChange={toggleOffline} />
                  <span className="slider" />
                </label>
              </div>
              <div className="mode-hint">
                {offline
                  ? 'Gera tudo localmente, sem internet ou chave de API.'
                  : 'Usa a IA Claude (requer chave de API e internet).'}
              </div>
            </div>
            <div className="sidebar-footer">
              <div>{offline ? 'Processamento local' : 'Powered by Claude AI'}</div>
              <button className="help-btn" style={{marginTop:6}} onClick={() => setShowOnboarding(true)}>
                Ver tutorial
              </button>
            </div>
          </div>

          {/* Main */}
          <div className="main">
            {section === 'content' && (
              <ContentSection content={content} onContentChange={handleContentChange} />
            )}
            {section === 'summary' && (
              <SummarySection content={content} offline={offline} />
            )}
            {section === 'flashcards' && (
              <FlashcardsSection content={content} offline={offline} />
            )}
            {section === 'quiz' && (
              <QuizSection content={content} offline={offline} />
            )}
            {section === 'stats' && (
              <StatsSection />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
