name: Build Dybass Estudioso

# Gera os instaladores automaticamente.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"
    inputs:
      release_tag:
        description: 'Tag da versão para publicar um Release (ex.: v1.0.0). Deixe vazio para apenas compilar.'
        required: false
        default: ''

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Gerar instalador Windows
        run: npm run build:win

      - name: Publicar artefatos (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: dybass-estudioso-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Gerar AppImage
        run: npm run build:linux

      - name: Publicar artefatos (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: dybass-estudioso-linux
          path: |
            dist/*.AppImage
          if-no-files-found: error

  # Cria um Release com os instaladores anexados.
  # Funciona via tag (push de v*) OU via disparo manual informando "release_tag".
  release:
    name: Publicar Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar Release com os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Dybass Estudioso ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          generate_release_notes: true
